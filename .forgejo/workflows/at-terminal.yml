name: at-terminal
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: at-terminal-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      _CL_: /MP4
      DOCKER_HOST: npipe:////./pipe/docker_engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive


      # Every run builds in one kept folder on the runner, so only what changed
      # recompiles and a merge of a built PR has almost nothing to do. git leaves
      # unchanged files' timestamps alone and keeps ignored build output. Deleting
      # the folder forces a full build.
      # MSBuild's tracking logs drop files under AppData or Temp unless they sit in
      # the project's own folder, and obj and bin never do, so the folder stays
      # outside AppData.
      - name: Move to the kept build tree
        run: |
          $ErrorActionPreference = 'Stop'
          $tree = Join-Path $env:USERPROFILE 'at-terminal-ci\tree'
          if (-not (Test-Path "$tree\.git")) { git init -q $tree }
          git -C $tree fetch -q --depth=1 --no-tags $env:GITHUB_WORKSPACE HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $tree checkout -q --force FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $tree clean -ffdq
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force -ErrorAction Ignore "$tree\out", "$tree\src\cascadia\CascadiaPackage\AppPackages"
          "TREE=$tree" | Add-Content $env:GITHUB_ENV

      # Restore, build and test run in a Windows container with the kept folder
      # mounted. The image is rebuilt only when its Dockerfile or its Build Tools layout
      # change. The layout, in Artifact Keeper's vs-layouts, is named by the Visual Studio
      # build and a hash of the bootstrapper's address and .vsconfig; a missing one is made
      # here and uploaded, so Microsoft is reached once per release or .vsconfig.
      # VS_BOOTSTRAPPER is the release's fixed-version bootstrapper (Visual Studio's
      # release history page), which makes only that release.
      - name: Container image
        working-directory: ${{ env.TREE }}
        env:
          VS_VERSION: 18.12.12405.243
          VS_BOOTSTRAPPER: https://download.visualstudio.microsoft.com/download/pr/4aa37a90-1dc9-4507-9e7b-49134341b6c4/5e7c32e82c89b3d69a2c818f3b06679909729b05e94609e3367bbb554d627f55/vs_BuildTools.exe # internet: Microsoft's Build Tools 18.12.0, only when its layout is missing from Artifact Keeper
          AK_TOKEN: ${{ secrets.AK_VS_LAYOUTS_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $docker = 'C:\Program Files\at-home\docker\current\docker.exe'
          $config = '.forgejo/container/.vsconfig'
          $hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$env:VS_BOOTSTRAPPER $((Get-FileHash $config).Hash)"))).Substring(0, 12).ToLower()
          $layout = "$env:VS_VERSION-$hash"
          $url = "https://artifacts.home.romaine.life/general/vs-layouts/$layout/layout.tar"
          $id = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes("$((Get-FileHash .forgejo/container/Dockerfile).Hash) $layout"))).Substring(0, 12).ToLower()
          $image = "at-terminal-build:$id"
          & $docker image inspect $image *> $null
          if ($LASTEXITCODE) {
            $code = (Invoke-WebRequest $url -Method Head -SkipHttpErrorCheck).StatusCode
            if ($code -eq 404) {
              if (-not $env:AK_TOKEN) { throw "The layout $layout is missing, and AK_VS_LAYOUTS_TOKEN, which uploads it, is not set" }
              $work = "D:\ci\at-terminal\layout-$layout"
              Remove-Item -Recurse -Force -ErrorAction Ignore $work
              New-Item -ItemType Directory "$work\layout" | Out-Null
              try {
                $bootstrapper = "$work\vs_BuildTools.exe"
                Invoke-WebRequest $env:VS_BOOTSTRAPPER -OutFile $bootstrapper
                if ((Get-FileHash $bootstrapper).Hash -ne ($env:VS_BOOTSTRAPPER -split '/')[-2]) { throw 'The bootstrapper does not match the SHA256 in its address' }
                $setup = Start-Process $bootstrapper -Wait -PassThru -ArgumentList '--layout', "$work\layout", '--config', (Resolve-Path $config).Path, '--lang', 'en-US', '--quiet', '--wait'
                if ($setup.ExitCode) { throw "Making the layout exited with $($setup.ExitCode)" }
                $made = (Get-Content -Raw "$work\layout\ChannelManifest.json" | ConvertFrom-Json).info.buildVersion
                if ($made -ne $env:VS_VERSION) { throw "The bootstrapper made Visual Studio $made; set VS_VERSION to it" }
                if (-not (Test-Path "$work\layout\vs_buildtools.exe")) { throw 'The layout has no vs_buildtools.exe for the Dockerfile to run' }
                Copy-Item $config "$work\layout\at-terminal.vsconfig"
                & "$env:SystemRoot\System32\tar.exe" -cf "$work\layout.tar" -C "$work\layout" .
                if ($LASTEXITCODE) { throw "tar exited with $LASTEXITCODE" }
                $null = Invoke-WebRequest "https://artifacts.home.romaine.life/api/v1/repositories/vs-layouts/artifacts/$layout/layout.tar" -Method Put -InFile "$work\layout.tar" -ContentType application/x-tar -Headers @{'X-API-Key' = $env:AK_TOKEN}
                Write-Host "Uploaded the layout $layout"
              } finally { Remove-Item -Recurse -Force -ErrorAction Ignore $work }
            } elseif ($code -ne 200) { throw "Looking up the layout $layout returned $code" }
            & $docker build --isolation=process -m 12g --build-arg "LAYOUT=$url" -t $image .forgejo/container
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "DOCKER=$docker", "IMAGE=$image" | Add-Content $env:GITHUB_ENV

      - name: Select package version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $headers = @{Authorization = "token $env:TOKEN"}
          $releases = Invoke-RestMethod "$api/releases?limit=100" -Headers $headers
          $same = $releases | Where-Object { $_.target_commitish -eq $env:GITHUB_SHA -and $_.tag_name -match '^v1\.25\.\d+\.0$' } | Select-Object -First 1
          if ($same) {
            $tag = $same.tag_name
          } else {
            $numbers = @($releases | ForEach-Object { if ($_.tag_name -match '^v1\.25\.(\d+)\.0$') { [int]$Matches[1] } })
            $next = if ($numbers.Count) { ($numbers | Measure-Object -Maximum).Maximum + 1 } else { 1 }
            while ($true) {
              $tag = "v1.25.$next.0"
              $old = Invoke-RestMethod "$api/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
              if ($code -eq 404 -or ($code -eq 200 -and $old.commit.sha -eq $env:GITHUB_SHA)) { break }
              if ($code -ne 200) { throw "Tag lookup returned $code" }
              $next++
            }
          }
          "VERSION=$($tag.Substring(1))", "RELEASE_TAG=$tag" | Add-Content $env:GITHUB_ENV
          Write-Host "Package version: $tag"

      - name: NuGet command line
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'at-terminal-ci-tools'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $nuget = Join-Path $dir 'nuget-6.14.0.exe'
          if (-not (Test-Path $nuget)) {
            $package = Join-Path $dir 'nuget.commandline.6.14.0.zip'
            Invoke-WebRequest 'https://artifacts.home.romaine.life/nuget/nuget/v3/flatcontainer/nuget.commandline/6.14.0/nuget.commandline.6.14.0.nupkg' -OutFile $package
            $archive = [IO.Compression.ZipFile]::OpenRead($package)
            try { [IO.Compression.ZipFileExtensions]::ExtractToFile($archive.GetEntry('tools/NuGet.exe'), $nuget, $true) } finally { $archive.Dispose(); Remove-Item -LiteralPath $package }
          }
          if ((Get-AuthenticodeSignature $nuget).Status -ne 'Valid') { throw 'NuGet signature validation failed' }
          "NUGET_EXE=$nuget" | Add-Content $env:GITHUB_ENV

      - name: Restore NuGet
        working-directory: ${{ env.TREE }}
        run: ./.forgejo/container/run.ps1 restore

      - name: Stamp the package version
        working-directory: ${{ env.TREE }}
        run: |
          $manifest = Join-Path $PWD 'src/cascadia/CascadiaPackage/Package-Dev.appxmanifest'
          $text = [IO.File]::ReadAllText($manifest)
          if ($text -notmatch 'Version="0\.0\.1\.0"') { throw 'The package version placeholder is missing' }
          [IO.File]::WriteAllText($manifest, $text.Replace('Version="0.0.1.0"', "Version=`"$env:VERSION`""))

      # vcpkg reads its registry at vcpkg.json's builtin-baseline from Forgejo's copy of
      # microsoft/vcpkg (run.ps1), which holds only the commits forgejo's k8s/copies.txt lists.
      - name: vcpkg's baseline is on Forgejo
        env:
          TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content -Raw vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          $code = (Invoke-WebRequest "$env:GITHUB_SERVER_URL/api/v1/repos/microsoft/vcpkg/git/commits/$($baseline)?stat=false&verification=false&files=false" -Headers @{Authorization = "token $env:TOKEN"} -SkipHttpErrorCheck).StatusCode
          if ($code -eq 404) { throw "Forgejo's microsoft/vcpkg lacks vcpkg.json's builtin-baseline $($baseline): add it to microsoft/vcpkg's lines in forgejo's k8s/copies.txt" }
          if ($code -ne 200) { throw "Looking up $baseline in Forgejo's microsoft/vcpkg returned $code" }

      - name: Build
        working-directory: ${{ env.TREE }}
        env:
          FORGEJO_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: |
          ./.forgejo/container/run.ps1 build
          $code = $LASTEXITCODE
          Copy-Item msbuild.binlog $env:GITHUB_WORKSPACE -ErrorAction Ignore
          exit $code

      - name: Test the state file, the log and the removed scrollbar settings
        working-directory: ${{ env.TREE }}
        env:
          FORGEJO_TOKEN: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
        run: ./.forgejo/container/run.ps1 test

      - name: Sign
        working-directory: ${{ env.TREE }}
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem src/cascadia/CascadiaPackage/AppPackages -Recurse -Filter *.msix | Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' })
          if ($packages.Count -ne 1) { throw "Expected one MSIX package, found $($packages.Count)" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            $msix = "out\at-terminal_$($env:VERSION)_x64.msix"
            Copy-Item $packages[0].FullName $msix
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD $msix
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa $msix
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD\cert.pfx", $env:PFX_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            try { [IO.File]::WriteAllBytes("$PWD\out\at-terminal.cer", $cert.Export('Cert')) } finally { $cert.Dispose() }
            Copy-Item -Recurse out $env:GITHUB_WORKSPACE
          } finally { Remove-Item -LiteralPath cert.pfx -Force }

      - uses: forgejo/upload-artifact@v4
        with:
          name: at-terminal
          path: out/*

      - uses: forgejo/upload-artifact@v4
        if: failure()
        with:
          name: msbuild-binlog
          path: msbuild.binlog
          if-no-files-found: ignore

      # The release stays a draft: home-sync.yml publishes it and starts every PC, which
      # takes at-terminal's newest release (AHT-86).
      - name: Release on Forgejo
        id: release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $headers = @{Authorization = "token $env:TOKEN"}
          $tag = $env:RELEASE_TAG
          $names = @("at-terminal_$($env:VERSION)_x64.msix", 'at-terminal.cer')
          $tagged = Invoke-RestMethod "$api/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 404) {
            Invoke-RestMethod "$api/tags" -Method Post -Headers $headers -ContentType application/json -Body (@{tag_name=$tag;target=$env:GITHUB_SHA}|ConvertTo-Json) | Out-Null
          } elseif ($code -ne 200 -or $tagged.commit.sha -ne $env:GITHUB_SHA) { throw 'Release tag lookup failed or points to another commit' }
          $release = Invoke-RestMethod "$api/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 200 -and -not $release.draft) {
            foreach ($name in $names) { if (-not ($release.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 })) { throw 'Published release is missing an asset' } }
            Write-Host "$tag is already published"
            "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
            exit 0
          }
          if ($code -eq 404) {
            $release = Invoke-RestMethod "$api/releases" -Method Post -Headers $headers -ContentType application/json -Body (@{tag_name=$tag;target_commitish=$env:GITHUB_SHA;name="at-terminal $env:VERSION";body="Built and signed on Forgejo from $env:GITHUB_SHA. https://openproject.romaine.life/wp/FORGEJO-3";draft=$true}|ConvertTo-Json)
          } elseif ($code -ne 200) { throw "Release lookup returned $code" }
          foreach ($name in $names) {
            foreach ($old in @($release.assets | Where-Object name -eq $name)) {
              Invoke-RestMethod "$api/releases/$($release.id)/assets/$($old.id)" -Method Delete -Headers $headers | Out-Null
            }
            Invoke-RestMethod "$api/releases/$($release.id)/assets?name=$name" -Method Post -Headers $headers -Form @{attachment=Get-Item "out/$name"} | Out-Null
          }
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT

  home-sync:
    needs: build
    if: needs.build.outputs.release-tag != ''
    uses: romaine-life/pipeline-templates/.forgejo/workflows/home-sync.yml@main
    secrets: inherit
    with:
      release-tag: ${{ needs.build.outputs.release-tag }}

  # The fetch check reads only the repo, and runs where Python is (FORGEJO-28).
  fetches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
