name: at-terminal
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: at-terminal-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_MAX_CONCURRENCY: "4"
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      _CL_: /MP4
      DOCKER_HOST: npipe:////./pipe/docker_engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Every run builds in one kept folder on the runner, so only what changed
      # recompiles and a merge of a built PR has almost nothing to do. git leaves
      # unchanged files' timestamps alone and keeps ignored build output. Deleting
      # the folder forces a full build.
      # MSBuild's tracking logs drop files under AppData or Temp unless they sit in
      # the project's own folder, and obj and bin never do, so the folder stays
      # outside AppData.
      - name: Move to the kept build tree
        run: |
          $ErrorActionPreference = 'Stop'
          $tree = Join-Path $env:USERPROFILE 'at-terminal-ci\tree'
          if (-not (Test-Path "$tree\.git")) { git init -q $tree }
          git -C $tree fetch -q --depth=1 --no-tags $env:GITHUB_WORKSPACE HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $tree checkout -q --force FETCH_HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git -C $tree clean -ffdq
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force -ErrorAction Ignore "$tree\out", "$tree\src\cascadia\CascadiaPackage\AppPackages"
          "TREE=$tree" | Add-Content $env:GITHUB_ENV

      # Restore, build and test run in a Windows container with the kept folder
      # mounted. The image is rebuilt only when its files change.
      - name: Container image
        working-directory: ${{ env.TREE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $docker = 'C:\Program Files\at-home\docker\current\docker.exe'
          $hashes = (Get-FileHash .forgejo/container/Dockerfile, .forgejo/container/.vsconfig).Hash -join ''
          $id = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($hashes))).Substring(0, 12).ToLower()
          $image = "at-terminal-build:$id"
          & $docker image inspect $image *> $null
          if ($LASTEXITCODE) {
            & $docker build --isolation=process -m 12g -t $image .forgejo/container
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          "DOCKER=$docker", "IMAGE=$image" | Add-Content $env:GITHUB_ENV

      - name: Select package version
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $headers = @{Authorization = "token $env:TOKEN"}
          $releases = Invoke-RestMethod "$api/releases?limit=100" -Headers $headers
          $same = $releases | Where-Object { $_.target_commitish -eq $env:GITHUB_SHA -and $_.tag_name -match '^v1\.25\.\d+\.0$' } | Select-Object -First 1
          if ($same) {
            $tag = $same.tag_name
          } else {
            $numbers = @($releases | ForEach-Object { if ($_.tag_name -match '^v1\.25\.(\d+)\.0$') { [int]$Matches[1] } })
            $next = if ($numbers.Count) { ($numbers | Measure-Object -Maximum).Maximum + 1 } else { 1 }
            while ($true) {
              $tag = "v1.25.$next.0"
              $old = Invoke-RestMethod "$api/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
              if ($code -eq 404 -or ($code -eq 200 -and $old.commit.sha -eq $env:GITHUB_SHA)) { break }
              if ($code -ne 200) { throw "Tag lookup returned $code" }
              $next++
            }
          }
          "VERSION=$($tag.Substring(1))", "RELEASE_TAG=$tag" | Add-Content $env:GITHUB_ENV
          Write-Host "Package version: $tag"

      - name: NuGet command line
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'at-terminal-ci-tools'
          New-Item -ItemType Directory -Force $dir | Out-Null
          $nuget = Join-Path $dir 'nuget-6.14.0.exe'
          if (-not (Test-Path $nuget)) { Invoke-WebRequest 'https://dist.nuget.org/win-x86-commandline/v6.14.0/nuget.exe' -OutFile $nuget }
          if ((Get-AuthenticodeSignature $nuget).Status -ne 'Valid') { throw 'NuGet signature validation failed' }
          "NUGET_EXE=$nuget" | Add-Content $env:GITHUB_ENV

      - name: Restore NuGet
        working-directory: ${{ env.TREE }}
        run: ./.forgejo/container/run.ps1 restore

      - name: Stamp the package version
        working-directory: ${{ env.TREE }}
        run: |
          $manifest = Join-Path $PWD 'src/cascadia/CascadiaPackage/Package-Dev.appxmanifest'
          $text = [IO.File]::ReadAllText($manifest)
          if ($text -notmatch 'Version="0\.0\.1\.0"') { throw 'The package version placeholder is missing' }
          [IO.File]::WriteAllText($manifest, $text.Replace('Version="0.0.1.0"', "Version=`"$env:VERSION`""))

      - name: Build
        working-directory: ${{ env.TREE }}
        run: |
          ./.forgejo/container/run.ps1 build
          $code = $LASTEXITCODE
          Copy-Item msbuild.binlog $env:GITHUB_WORKSPACE -ErrorAction Ignore
          exit $code

      - name: Test the state file, the log and the removed scrollbar settings
        working-directory: ${{ env.TREE }}
        run: ./.forgejo/container/run.ps1 test

      - name: Sign
        working-directory: ${{ env.TREE }}
        env:
          PFX: ${{ secrets.AT_TERMINAL_PFX }}
          PFX_PASSWORD: ${{ secrets.AT_TERMINAL_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(Get-ChildItem src/cascadia/CascadiaPackage/AppPackages -Recurse -Filter *.msix | Where-Object { $_.FullName -notmatch '[\\/]Dependencies[\\/]' })
          if ($packages.Count -ne 1) { throw "Expected one MSIX package, found $($packages.Count)" }
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          [IO.File]::WriteAllBytes("$PWD\cert.pfx", [Convert]::FromBase64String($env:PFX))
          try {
            $msix = "out\at-terminal_$($env:VERSION)_x64.msix"
            Copy-Item $packages[0].FullName $msix
            & $signtool.FullName sign /fd SHA256 /f cert.pfx /p $env:PFX_PASSWORD $msix
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $signtool.FullName verify /pa $msix
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD\cert.pfx", $env:PFX_PASSWORD, [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)
            try { [IO.File]::WriteAllBytes("$PWD\out\at-terminal.cer", $cert.Export('Cert')) } finally { $cert.Dispose() }
            Copy-Item -Recurse out $env:GITHUB_WORKSPACE
          } finally { Remove-Item -LiteralPath cert.pfx -Force }

      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: at-terminal
          path: out/*

      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        if: failure()
        with:
          name: msbuild-binlog
          path: msbuild.binlog
          if-no-files-found: ignore

      - name: Release on Forgejo
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_SERVER_URL/api/v1/repos/$env:GITHUB_REPOSITORY"
          $headers = @{Authorization = "token $env:TOKEN"}
          $tag = $env:RELEASE_TAG
          $names = @("at-terminal_$($env:VERSION)_x64.msix", 'at-terminal.cer')
          $tagged = Invoke-RestMethod "$api/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 404) {
            Invoke-RestMethod "$api/tags" -Method Post -Headers $headers -ContentType application/json -Body (@{tag_name=$tag;target=$env:GITHUB_SHA}|ConvertTo-Json) | Out-Null
          } elseif ($code -ne 200 -or $tagged.commit.sha -ne $env:GITHUB_SHA) { throw 'Release tag lookup failed or points to another commit' }
          $release = Invoke-RestMethod "$api/releases/tags/$tag" -Headers $headers -SkipHttpErrorCheck -StatusCodeVariable code
          if ($code -eq 200 -and -not $release.draft) {
            foreach ($name in $names) { if (-not ($release.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 })) { throw 'Published release is missing an asset' } }
            Write-Host "$tag is already published"
            exit 0
          }
          if ($code -eq 404) {
            $release = Invoke-RestMethod "$api/releases" -Method Post -Headers $headers -ContentType application/json -Body (@{tag_name=$tag;target_commitish=$env:GITHUB_SHA;name="at-terminal $env:VERSION";body="Built and signed on Forgejo from $env:GITHUB_SHA. https://openproject.romaine.life/wp/FORGEJO-3";draft=$true}|ConvertTo-Json)
          } elseif ($code -ne 200) { throw "Release lookup returned $code" }
          foreach ($name in $names) {
            foreach ($old in @($release.assets | Where-Object name -eq $name)) {
              Invoke-RestMethod "$api/releases/$($release.id)/assets/$($old.id)" -Method Delete -Headers $headers | Out-Null
            }
            Invoke-RestMethod "$api/releases/$($release.id)/assets?name=$name" -Method Post -Headers $headers -Form @{attachment=Get-Item "out/$name"} | Out-Null
          }
          Invoke-RestMethod "$api/releases/$($release.id)" -Method Patch -Headers $headers -ContentType application/json -Body '{"draft":false}' | Out-Null
